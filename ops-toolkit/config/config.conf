# ========== 告警配置 ==========
# Server酱 SendKey（必填）【需要理解——这个值以后只在这里改】
SENDKEY="******************************"

# ========== 阈值配置 ==========
CPU_THRESHOLD=80       # CPU 告警阈值（%）【需要记忆】
MEM_THRESHOLD=90       # 内存告警阈值（%）【需要记忆】
DISK_THRESHOLD=85      # 磁盘告警阈值（%）【需要记忆】
SSH_BAN_THRESHOLD=10   # SSH 封禁阈值（次）【需要记忆】

# ========== 路径配置 ==========
SECURE_LOG="/var/log/secure"         # SSH 监控日志路径
NGINX_LOG="/var/log/nginx/access.log" # Nginx 日志路径
REPORT_DIR="/tmp"                     # 报告输出目录

# ========== 定时任务配置 ==========
CRON_INTERVAL="*/10"  # 巡检间隔（分钟）【需要理解——crontab 的分字段】


